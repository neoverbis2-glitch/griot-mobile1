name: GRIOT Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android Assets (Icons & Splash)
        run: node scripts/generate-android-assets.mjs

      - name: Validate runtime runner
        run: |
          node --check runtime-runner/server.mjs
          node --test runtime-runner/runtime-runner.test.mjs

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Sync GRIOT native integration
        run: node scripts/sync-griot-native.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APKs (Release & Debug)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Verify APK Integrity and Badging
        run: |
          RELEASE_APK=$(find android -type f -path '*/outputs/apk/release/*-release.apk' | head -n 1)
          DEBUG_APK=$(find android -type f -path '*/outputs/apk/debug/*-debug.apk' | head -n 1)
          test -n "$RELEASE_APK"
          test -n "$DEBUG_APK"
          cp "$RELEASE_APK" GRIOT-v1.0.8-release.apk
          cp "$DEBUG_APK" GRIOT-v1.0.8-debug.apk
          sha256sum GRIOT-v1.0.8-release.apk GRIOT-v1.0.8-debug.apk
          ls -lh GRIOT-v1.0.8-release.apk GRIOT-v1.0.8-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging GRIOT-v1.0.8-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose GRIOT-v1.0.8-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose GRIOT-v1.0.8-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: griot-mobile-v1-apks
          path: |
            GRIOT-v1.0.8-release.apk
            GRIOT-v1.0.8-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with Raw APKs
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.8
          name: "GRIOT Mobile v1.0.8"
          body: "Instalação direta dos APKs Release e Debug (compatível com Android 14 / One UI 6, assinatura v1+v2+v3, extractNativeLibs=true e suporte nativo ao Observer)."
          files: |
            GRIOT-v1.0.8-release.apk
            GRIOT-v1.0.8-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
