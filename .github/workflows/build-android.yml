name: GRIOT Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile response delivery hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          chat = Path("src/components/griot/chat-surface.tsx")
          text = chat.read_text()
          anchor = '''      await chatExecutionManager.startExecution({
        conversationId: targetConvId,
        scope: targetScope,
        userId,
        modelId: model,
        messages: base,
        userPrompt: lastUserPrompt,
        effort: activeEffort,
        systemInstruction: sysInstruction,
        context,
        currentProject,
      });
      console.log("[GRIOT_DEBUG] startExecution terminou sem lançar erro");'''
          replacement = '''      await chatExecutionManager.startExecution({
        conversationId: targetConvId,
        scope: targetScope,
        userId,
        modelId: model,
        messages: base,
        userPrompt: lastUserPrompt,
        effort: activeEffort,
        systemInstruction: sysInstruction,
        context,
        currentProject,
      });

      // Reconciliação pós-execução: garante que a resposta final persistida
      // pelo execution manager entra no estado React depois do fim da animação.
      if (typeof window !== "undefined" && targetConvId) {
        try {
          const rawFinal = localStorage.getItem("griot_messages_" + targetConvId);
          if (rawFinal) {
            const finalMessages = JSON.parse(rawFinal);
            if (Array.isArray(finalMessages)) {
              setMessages(finalMessages);
            }
          }
        } catch (reconcileErr) {
          console.warn("[GRIOT_DEBUG] reconciliação final de mensagens falhou:", reconcileErr);
        }
      }

      console.log("[GRIOT_DEBUG] startExecution terminou sem lançar erro");'''
          if anchor in text and "Reconciliação pós-execução" not in text:
              chat.write_text(text.replace(anchor, replacement, 1))

          pkg = Path("package.json")
          pkg_text = pkg.read_text()
          pkg_text = re.sub(r'("version"\s*:\s*")1\.0\.39(\\")', r'\g<1>1.0.40\2', pkg_text, count=1)
          pkg.write_text(pkg_text)

          gradle = Path("android/app/build.gradle")
          gradle_text = gradle.read_text()
          gradle_text = re.sub(r'(versionName\s+")1\.0\.39(\\")', r'\g<1>1.0.40\2', gradle_text, count=1)
          gradle.write_text(gradle_text)
          PY

          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/griot/chat-surface.tsx package.json android/app/build.gradle
            git commit -m "fix(chat): reconcile completed assistant response"
            git push
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android Assets (Icons & Splash)
        run: node scripts/generate-android-assets.mjs

      - name: Validate runtime runner
        run: |
          node --check runtime-runner/server.mjs
          node --test runtime-runner/runtime-runner.test.mjs

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Sync GRIOT native integration
        run: node scripts/sync-griot-native.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find android -type f -path '*/outputs/apk/debug/*-debug.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" GRIOT-Mobile-debug.apk
          echo "APK=GRIOT-Mobile-debug.apk" >> "$GITHUB_ENV"
          sha256sum GRIOT-Mobile-debug.apk
          GRADLE_VER=$(grep 'versionName' android/app/build.gradle | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -n "$GRADLE_VER" ]; then
            TAG_TO_USE="v$GRADLE_VER"
          else
            TAG_TO_USE="v1.0.30"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_TO_USE="${{ github.ref_name }}"
          fi
          echo "RELEASE_TAG=$TAG_TO_USE" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=GRIOT Mobile $TAG_TO_USE" >> "$GITHUB_ENV"
          AAPT2_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          if [ -n "$AAPT2_BIN" ] && [ -x "$AAPT2_BIN" ]; then
            "$AAPT2_BIN" dump badging GRIOT-Mobile-debug.apk || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: griot-mobile-debug-apk
          path: GRIOT-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: GRIOT-Mobile-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}