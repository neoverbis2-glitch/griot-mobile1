name: GRIOT Runtime Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime-runner/**'
      - 'src/routes/api/runtime/**'
      - 'src/lib/runtime/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node --check runtime-runner/server.mjs
      - run: node --input-type=module -e "import('./runtime-runner/server.mjs').catch(e => { if (e.code !== 'ERR_MODULE_NOT_FOUND') throw e })"
      - name: Build runtime container
        run: docker build --pull -t griot-runtime-runner:ci runtime-runner
